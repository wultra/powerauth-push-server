# Allow externalization of properties using application-ext.properties
spring.profiles.active=ext

# Database Configuration - PostgreSQL
spring.datasource.url=${PUSH_SERVER_DATASOURCE_URL:jdbc:postgresql://localhost:5432/powerauth}
spring.datasource.username=${PUSH_SERVER_DATASOURCE_USERNAME:powerauth}
spring.datasource.password=${PUSH_SERVER_DATASOURCE_PASSWORD:}
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.pool-name=HikariPool-Push-Server
spring.datasource.hikari.maximumPoolSize=${PUSH_SERVER_DATASOURCE_HIKARI_MAX_CONNECTIONS:10}
spring.datasource.hikari.minimumIdle=${PUSH_SERVER_DATASOURCE_HIKARI_MIN_IDLE:10}
spring.jpa.properties.hibernate.connection.CharSet=${PUSH_SERVER_JPA_CHARSET:utf8}
spring.jpa.properties.hibernate.connection.characterEncoding=${PUSH_SERVER_JPA_CHARACTER_ENCODING:utf8}
spring.jpa.properties.hibernate.connection.useUnicode=${PUSH_SERVER_JPA_USE_UNICODE:true}
# Database Configuration - JNDI
spring.datasource.jndi-name=${PUSH_SERVER_DATASOURCE_JNDI_NAME:false}

# Database Configuration - Oracle
#spring.datasource.url=jdbc:oracle:thin:@//127.0.0.1:1521/powerauth
#spring.datasource.username=powerauth
#spring.datasource.password=
# The following property speeds up Spring Boot startup
#spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Spring Batch Configuration
spring.batch.job.enabled=${PUSH_SERVER_SPRING_BATCH_JOB_ENABLED:false}
spring.batch.jdbc.initialize-schema=never

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none

# PowerAuth Service Configuration
powerauth.service.url=${PUSH_SERVER_POWERAUTH_SERVICE_URL:http://localhost:8080/powerauth-java-server/rest}
powerauth.service.restClientConfig.responseTimeout=${PUSH_SERVER_POWERAUTH_SERVICE_RESPONSE_TIMEOUT:60s}
powerauth.service.restClientConfig.maxIdleTime=${PUSH_SERVER_POWERAUTH_SERVICE_MAX_IDLE_TIME:200s}
powerauth.service.security.clientToken=${PUSH_SERVER_SECURITY_CLIENT_TOKEN:}
powerauth.service.security.clientSecret=${PUSH_SERVER_SECURITY_CLIENT_SECRET:}
powerauth.service.ssl.acceptInvalidSslCertificate=${PUSH_SERVER_ACCEPT_INVALID_SSL_CERTIFICATE:false}

# PowerAuth Push Service Configuration
powerauth.push.service.url=${PUSH_SERVER_PUSH_SERVICE_URL:}
powerauth.push.service.applicationName=${PUSH_SERVER_APPLICATION_NAME:powerauth-push}
powerauth.push.service.applicationDisplayName=${PUSH_SERVER_APPLICATION_DISPLAY_NAME:PowerAuth Push Server}
powerauth.push.service.applicationEnvironment=${PUSH_SERVER_APPLICATION_ENVIRONMENT:}

banner.application.name=${powerauth.push.service.applicationDisplayName}
banner.application.version=@project.version@

# PowerAuth Push Campaign Setup
powerauth.push.service.campaign.batchSize=${PUSH_SERVER_CAMPAIGN_BATCH_SIZE:100000}

# Whether persistent storing of sent messages is enabled
powerauth.push.service.message.storage.enabled=${PUSH_SERVER_MESSAGE_STORAGE_ENABLED:false}

# Whether push registration supports associated activations
powerauth.push.service.registration.multipleActivations.enabled=${PUSH_SERVER_REGISTRATION_MULTIPLE_ACTIVATIONS_ENABLED:false}

# Retry logic of creating a new device registration
powerauth.push.service.registration.retry.backoff=100
powerauth.push.service.registration.retry.maxAttempts=2

powerauth.push.service.clients.cache.refreshAfterWrite=5m

# APNs Configuration
powerauth.push.service.apns.useDevelopment=${PUSH_SERVER_APNS_DEVELOPMENT:true}
powerauth.push.service.apns.proxy.enabled=${PUSH_SERVER_APNS_PROXY_ENABLED:false}
powerauth.push.service.apns.proxy.host=${PUSH_SERVER_APNS_PROXY_HOST:127.0.0.1}
powerauth.push.service.apns.proxy.port=${PUSH_SERVER_APNS_PROXY_PORT:8080}
powerauth.push.service.apns.proxy.username=${PUSH_SERVER_APNS_PROXY_USERNAME:}
powerauth.push.service.apns.proxy.password=${PUSH_SERVER_APNS_PROXY_PASSWORD:}

# FCM Configuration
powerauth.push.service.fcm.proxy.enabled=${PUSH_SERVER_FCM_PROXY_ENABLED:false}
powerauth.push.service.fcm.proxy.host=${PUSH_SERVER_FCM_PROXY_HOST:127.0.0.1}
powerauth.push.service.fcm.proxy.port=${PUSH_SERVER_FCM_PROXY_PORT:8080}
powerauth.push.service.fcm.proxy.username=${PUSH_SERVER_FCM_PROXY_USERNAME:}
powerauth.push.service.fcm.proxy.password=${PUSH_SERVER_FCM_PROXY_PASSWORD:}
powerauth.push.service.fcm.dataNotificationOnly=${PUSH_SERVER_FCM_DATA_NOTIFICATION_ONLY:false}
powerauth.push.service.fcm.sendMessageUrl=https://fcm.googleapis.com/v1/projects/%s/messages:send

# HMS Configuration
powerauth.push.service.hms.proxy.enabled=${PUSH_SERVER_HMS_PROXY_ENABLED:false}
powerauth.push.service.hms.proxy.host=${PUSH_SERVER_HMS_PROXY_HOST:127.0.0.1}
powerauth.push.service.hms.proxy.port=${PUSH_SERVER_HMS_PROXY_PORT:8080}
powerauth.push.service.hms.proxy.username=${PUSH_SERVER_HMS_PROXY_USERNAME:}
powerauth.push.service.hms.proxy.password=${PUSH_SERVER_HMS_PROXY_PASSWORD:}
powerauth.push.service.hms.dataNotificationOnly=${PUSH_SERVER_HMS_DATA_NOTIFICATION_ONLY:false}
powerauth.push.service.hms.sendMessageUrl=https://push-api.cloud.huawei.com/v2/%s/messages:send
powerauth.push.service.hms.tokenUrl=https://oauth-login.cloud.huawei.com/oauth2/v3/token

# Set JMX default domain in case JMX is enabled, otherwise the application startup fails due to clash in JMX bean names
spring.jmx.enabled=${PUSH_SERVER_SPRING_JMX_ENABLED:false}
spring.jmx.default-domain=${PUSH_SERVER_SPRING_JMX_DEFAULT_DOMAIN:powerauth-push-server}

# Push message gateway connect timeout in milliseconds
powerauth.push.service.fcm.connect.timeout=${PUSH_SERVER_FCM_CONNECT_TIMEOUT:5000}
powerauth.push.service.apns.connect.timeout=${PUSH_SERVER_APNS_CONNECT_TIMEOUT:5000}
powerauth.push.service.hms.connect.timeout=${PUSH_SERVER_HMS_CONNECT_TIMEOUT:5s}
powerauth.push.service.hms.response.timeout=60s
powerauth.push.service.hms.max-idle-time=200s

# Push message networking settings
powerauth.push.service.apns.idlePingInterval=60000

# Push message concurrency settings
powerauth.push.service.apns.concurrentConnections=1

# Java security CA certs file password
powerauth.push.java.cacerts.password=changeit

# Disable open session in view to avoid startup warning of Spring boot
spring.jpa.open-in-view=false

# Disable swagger-ui default petstore url
springdoc.swagger-ui.disable-swagger-default-url=true

# Disable internal logging for Netty due to noisy logging of native library loading
logging.level.io.netty.util.internal.NativeLibraryLoader=WARN

# Custom Logging Configuration
logging.config=${PUSH_SERVER_LOGGING:}

# Configure Correlation HTTP Header
powerauth.service.correlation-header.enabled=false
powerauth.service.correlation-header.name=X-Correlation-ID
powerauth.service.correlation-header.value.validation-regexp=[a-zA-Z0-9\\-]{8,1024}
# For logging correlation HTTP headers enable the pattern and update correlation header name in the pattern
#logging.pattern.console=%clr(%d{${LOG_DATEFORMAT_PATTERN:yyyy-MM-dd HH:mm:ss.SSS}}){faint} %clr(${LOG_LEVEL_PATTERN:%5p}) [%X{X-Correlation-ID}] %clr(%5p) %clr(${PID: }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}

# Monitoring
management.tracing.sampling.probability=1.0
#management.endpoint.metrics.enabled=true
#management.endpoints.web.exposure.include=health, prometheus
#management.endpoint.prometheus.enabled=true
#management.prometheus.metrics.export.enabled=true

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.actuate.autoconfigure.metrics.jersey.JerseyServerMetricsAutoConfiguration
